[pytest]

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

markers =
    smoke: Critical application smoke tests
    sanity: Core feature validation
    regression: Full regression test suite
    e2e: End-to-end business scenarios
    negative: Negative and validation scenarios