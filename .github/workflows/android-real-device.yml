name: Android Real Device Automation

on:

  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  android:

    runs-on: self-hosted

    timeout-minutes: 90

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify ADB
        shell: cmd
        run: |
          adb version
          adb devices

      - name: Verify Appium
        shell: cmd
        run: |
          appium --version

      - name: Start Appium
        shell: cmd
        run: |
          start "" cmd /c appium

      - name: Wait For Appium
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

      - name: Execute Complete Test Suite
        run: |
          pytest \
          -v \
          --tb=short \
          --html=reports/report.html \
          --self-contained-html

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Report
          path: reports/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: logs/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure
          path: allure-results/
          if-no-files-found: ignore