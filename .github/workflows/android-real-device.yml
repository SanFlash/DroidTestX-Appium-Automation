name: Android Real Device Automation

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  android:
    runs-on: self-hosted
    timeout-minutes: 90

    env:
      PYTHON_HOME: C:\action-runner\_work\_tool\Python\3.11.9\x64

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Python 3.11
        shell: powershell
        run: |
          "$env:PYTHON_HOME" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:PYTHON_HOME\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Python
        run: |
          echo ================================
          echo Python Information
          echo ================================
          python --version
          where python
          python -m pip --version

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Verify Java
        run: |
          java -version

      - name: Verify ADB
        run: |
          adb version
          adb devices

      - name: Verify Connected Device
        shell: powershell
        run: |
          $devices = adb devices | Select-String "device$"

          if ($devices.Count -eq 0) {
            Write-Error "No Android device connected."
            exit 1
          }

          Write-Host "Android device detected."

      - name: Verify Appium
        run: |
          appium --version

      - name: Start Appium Server
        shell: powershell
        run: |
          Start-Process appium -ArgumentList "--address","127.0.0.1","--port","4723"

      - name: Wait For Appium
        shell: powershell
        run: |
          $maxRetries = 30

          for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                  $response = Invoke-WebRequest http://127.0.0.1:4723/status -UseBasicParsing

                  if ($response.StatusCode -eq 200) {
                      Write-Host "Appium Server Ready"
                      exit 0
                  }
              }
              catch {
                  Write-Host "Waiting for Appium ($i/$maxRetries)..."
              }

              Start-Sleep -Seconds 2
          }

          throw "Appium failed to start."

      - name: Create Report Directories
        run: |
          if not exist reports mkdir reports
          if not exist screenshots mkdir screenshots
          if not exist logs mkdir logs
          if not exist allure-results mkdir allure-results

      - name: Verify Pytest
        run: |
          python -m pytest --version

      - name: Execute Test Suite
        run: |
          python -m pytest -v --tb=short --html=reports/report.html --self-contained-html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Report
          path: reports/
          if-no-files-found: ignore

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Results
          path: allure-results/
          if-no-files-found: ignore
