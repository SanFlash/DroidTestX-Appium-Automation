name: Android Real Device Automation

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  android:
    runs-on: self-hosted
    timeout-minutes: 90

    env:
      PYTHON_HOME: C:\Users\satye\AppData\Local\Programs\Python\Python311

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Python
        shell: powershell
        run: |
          "$env:PYTHON_HOME" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:PYTHON_HOME\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Python
        run: |
          echo ================================
          echo Python Information
          echo ================================
          "%PYTHON_HOME%\python.exe" --version
          "%PYTHON_HOME%\python.exe" -m pip --version

      - name: Upgrade pip
        run: |
          "%PYTHON_HOME%\python.exe" -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          "%PYTHON_HOME%\python.exe" -m pip install -r requirements.txt

      - name: Verify Java
        run: |
          java -version

      - name: Verify ADB
        run: |
          adb version
          adb devices

      - name: Verify Connected Device
        shell: powershell
        run: |
          $devices = adb devices | Select-String "device$"

          if ($devices.Count -eq 0) {
            throw "No Android device connected."
          }

          Write-Host "Android device detected."

      - name: Verify Appium
        run: |
          appium --version

      - name: Start Appium
        shell: powershell
        run: |
          Start-Process appium -ArgumentList "--address","127.0.0.1","--port","4723"

      - name: Wait For Appium
        shell: powershell
        run: |
          for ($i=1; $i -le 30; $i++) {
            try {
              Invoke-WebRequest http://127.0.0.1:4723/status -UseBasicParsing | Out-Null
              Write-Host "Appium Ready"
              exit 0
            }
            catch {
              Write-Host "Waiting... ($i/30)"
              Start-Sleep 2
            }
          }

          throw "Appium failed to start."

      - name: Create Report Directories
        run: |
          if not exist reports mkdir reports
          if not exist screenshots mkdir screenshots
          if not exist logs mkdir logs
          if not exist allure-results mkdir allure-results

      - name: Verify pytest
        run: |
          "%PYTHON_HOME%\python.exe" -m pytest --version

      - name: Execute Tests
        run: |
          "%PYTHON_HOME%\python.exe" -m pytest -v --tb=short --html=reports/report.html --self-contained-html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Report
          path: reports/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: logs/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Results
          path: allure-results/
