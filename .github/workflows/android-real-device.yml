name: Android Real Device Automation

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  android:
    runs-on: self-hosted

    timeout-minutes: 90

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          echo ===============================
          echo Python Information
          echo ===============================
          python --version
          where python
          pip --version

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Java
        run: |
          java -version

      - name: Verify ADB
        run: |
          adb version
          adb devices

      - name: Verify Appium
        run: |
          appium --version

      - name: Create Report Directories
        run: |
          if not exist reports mkdir reports
          if not exist screenshots mkdir screenshots
          if not exist logs mkdir logs
          if not exist allure-results mkdir allure-results

      - name: Start Appium Server
        run: |
          start "Appium Server" cmd /k appium --address 127.0.0.1 --port 4723

      - name: Wait for Appium
        shell: powershell
        run: |
          $maxRetries = 30
          $retry = 0

          while ($retry -lt $maxRetries) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:4723/status" -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                Write-Host "Appium Server is Ready."
                exit 0
              }
            }
            catch {
              Write-Host "Waiting for Appium..."
            }

            Start-Sleep -Seconds 2
            $retry++
          }

          throw "Appium server failed to start."

      - name: Verify Connected Device
        run: |
          adb devices

      - name: Execute Test Suite
        run: |
          pytest -v --tb=short --html=reports/report.html --self-contained-html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Report
          path: reports/
          if-no-files-found: ignore

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Results
          path: allure-results/
          if-no-files-found: ignore
