name: Android Automation CI

on:
  push:
    branches:
      - main
      - develop
      - master

  pull_request:
    branches:
      - main
      - develop
      - master

permissions:
  contents: read

jobs:

  build:

    name: Build & Validate Framework

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: Show Python Version
        run: python --version

      - name: Show Pytest Version
        run: pytest --version

      - name: Validate Test Discovery
        run: |
          pytest --collect-only

      - name: Execute Smoke Tests
        continue-on-error: true
        run: |
          pytest \
          -m smoke \
          -v \
          --tb=short \
          --html=reports/report.html \
          --self-contained-html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Report
          path: reports/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: logs/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure
          path: allure-results/
          if-no-files-found: ignore